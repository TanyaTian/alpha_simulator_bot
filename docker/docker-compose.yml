version: '3.8'
services:
  alpha_simulator_bot:
    build:
      context: ../  # 构建上下文指向根目录
      dockerfile: Dockerfile  # 指定根目录下的 Dockerfile
    volumes:
      - ../logs:/logs
      - ../data:/app/data
      - ../config:/config
      - ../output:/output
      - ../output:/app/output
    command: python main.py
    stop_grace_period: 60s  # 设置 60 秒超时
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 👈 让容器能通过这个名字访问宿主机
    ports:
      - "5001:5001"  # 👈 把容器的 5001 映射到宿主机的 5001
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1400M
        reservations:
          cpus: '0.2'
          memory: 512M
    memswap_limit: 1400M  # 禁止 swap，内存超限直接 OOM 而不会拖垮系统
    pids_limit: 100       # 防止进程数爆炸